name: Daily dengue forecast pipeline

on:
  schedule:
    # 06:00 UTC daily — adjust to your preferred time
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_train:
        description: "Force a retrain regardless of the trigger check"
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        run: |
          if [ "${{ inputs.force_train }}" = "true" ]; then
            python scheduler.py --force-train
          else
            python scheduler.py
          fi

      - name: Commit updated data & artifacts
        run: |
          git config user.name "dengue-forecast-bot"
          git config user.email "actions@github.com"
          git add data/ artifacts/
          git diff --staged --quiet || git commit -m "Automated pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

